<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Job Opportunity | Alumni Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/alumni-post-job.css">
    <link rel="stylesheet" href="../css/footer.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
    <div class="brand">
        <i class="fas fa-graduation-cap"></i>
        <div>
            <div class="brand-title">Tech University</div>
            <div class="brand-subtitle">Alumni Dashboard</div>
        </div>
    </div>

    <nav class="nav-links">
        <a href="alumni-dashboard.html" class="active">Dashboard</a>
        <a href="alumni-profile.html">My Profile</a>
        <a href="mentorship-requests.html">Mentorship</a>
        <a href="alumni-post-job.html">Post Job</a>
        <a href="events.html">Events</a>
        <a href="login.html" class="logout">Logout</a>
    </nav>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="post-job-container">

    <section class="page-header">
        <h1>Post Job / Internship</h1>
        <p>Share opportunities and manage your postings</p>
    </section>

    <section class="job-layout">

        <!-- ===== LEFT: POST JOB FORM ===== -->
        <div class="job-form-card">
            <h2>Add New Opportunity</h2>

            <form id="jobForm">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Job Type</label>
                        <select id="jobType" required>
                            <option value="">Select</option>
                            <option>Internship</option>
                            <option>Full-Time</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="location" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Skills (comma separated)</label>
                    <input type="text" id="skills" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label>Application Link / Email</label>
                    <input type="text" id="applyLink" required>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i> Post Job
                </button>
            </form>
        </div>

        <!-- ===== RIGHT: POSTED JOBS ===== -->
        <div class="posted-jobs-card">
            <h2>Your Posted Opportunities</h2>

            <div id="postedJobsList"></div>
        </div>

    </section>

</main>

<div id="footer-placeholder"></div>
<script src="../js/includeFooter.js"></script>
<script src="../js/alumni-post-job.js"></script>

</body>
</html>
