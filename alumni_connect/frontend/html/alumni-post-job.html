<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Post Job | Alumni Connect</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/alumni-post-job.css">
<link rel="stylesheet" href="../css/footer.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div id="navbar-placeholder"></div>

<main class="dashboard">

<div class="page-header">

<h1>
<i class="fas fa-briefcase"></i>
Post Job Opportunity
</h1>

<p>Share opportunities with students from your network.</p>

</div>


<div class="post-job-container">

<!-- JOB FORM -->

<div class="job-form">

<h3>Job Details</h3>

<form id="postJobForm">

<div class="form-group">
<label>Job Title</label>
<input type="text" id="title" placeholder="Software Engineer" required>
</div>

<div class="form-group">
<label>Company Name</label>
<input type="text" id="company" placeholder="Google" required>
</div>

<div class="form-group">
<label>Application Link</label>
<input type="url" id="applicationLink"
placeholder="https://careers.company.com/job/123"
required>
</div>

<button class="btn-post">
<i class="fas fa-paper-plane"></i>
Post Job
</button>

</form>

</div>


<!-- JOB HISTORY -->

<div class="posted-jobs">

<h3>Your Posted Jobs</h3>

<div id="jobsHistoryContainer" class="jobs-history-container">

<div class="loading-state">
<div class="loading-spinner"></div>
<p>Loading jobs...</p>
</div>

</div>

</div>

</div>

</main>

<div id="footer-placeholder"></div>

<script src="../js/includeFooter.js"></script>
<script src="../js/alumni-post-job.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
