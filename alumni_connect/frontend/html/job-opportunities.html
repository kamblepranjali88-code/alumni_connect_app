<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Opportunities | Alumni Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Common styles -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/job-opportunities.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
  <div id="navbar-placeholder"></div>

<!-- ===== MAIN CONTENT ===== -->
<main class="jobs-container">

    <!-- Header -->
    <section class="jobs-header">
        <div>
            <h1>Job & Internship Opportunities</h1>
            <p>Explore opportunities shared by alumni</p>
        </div>
    </section>

    <!-- Filters -->
    <section class="job-filters">
    <select id="filterType">
        <option value="All">All Types</option>
        <option value="Internship">Internship</option>
        <option value="Full-Time">Full-Time</option>
    </select>

    <input
        type="text"
        id="searchJob"
        placeholder="Search by role or skill (e.g. React, Java)">
</section>

    <!-- Job Cards -->
    <section class="jobs-list" id="jobsList"></section>

</main>

<!-- ===== FOOTER ===== -->
<div id="footer-placeholder"></div>
<script src="../js/includeFooter.js"></script>
<script src="../js/job-opportunities.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
