<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alumni Registration | Alumni Connect</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h2>Alumni Registration</h2>
            <p>Register if you haven't received credentials</p>
        </div>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name">

        <label>Email ID</label>
        <input type="email" placeholder="your.email@gmail.com">

        <label>Graduation Year</label>
        <select>
            <option>Select year</option>
            <option>2021</option>
            <option>2022</option>
            <option>2023</option>
        </select>

        <label>Branch</label>
        <select>
            <option>Select branch</option>
            <option>Computer Engineering</option>
            <option>IT</option>
            <option>ENTC</option>
        </select>

        <label>Current Company</label>
        <input type="text" placeholder="Enter your company name">

        <div class="auth-info">
            Your account will be activated after admin verification.<br>
            Login credentials will be sent via email.
        </div>

        <button class="auth-btn">Submit Registration</button>

        <p class="auth-switch">
            Already have credentials?
            <a href="login.html">Login here</a>
        </p>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>
</div>

</body>
</html>
