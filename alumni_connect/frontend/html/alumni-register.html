<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alumni Registration</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/alumni-register.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>

<div class="auth-wrapper">

    <div class="auth-card">
        <h3>Alumni Registration</h3>
        <p class="subtitle">
            Register if you haven't received login credentials
        </p>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name">

        <label>Email ID</label>
        <input type="email" placeholder="your.email@gmail.com">

        <label>Graduation Year</label>
        <select>
            <option>Select year</option>
            <option>2020</option>
            <option>2021</option>
            <option>2022</option>
        </select>

        <label>Branch</label>
        <select>
            <option>Select branch</option>
            <option>Computer Engineering</option>
            <option>IT</option>
            <option>ENTC</option>
        </select>

        <label>Current Company</label>
        <input type="text" placeholder="Enter your current company">

        <div class="info-box">
            Your account will be activated after admin verification.
            Login credentials will be sent via email.
        </div>

        <button class="btn primary full">Submit Registration</button>

        <p class="switch">
            Already have credentials?
            <a href="login.html">Login here</a>
        </p>
    </div>

     <a href="index.html" class="back">← Back to home</a>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>
<script src="../js/includeFooter.js"></script>

</body>
</html>
