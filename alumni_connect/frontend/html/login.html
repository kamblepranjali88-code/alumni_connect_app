<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Alumni Connect</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-sign-in-alt"></i>
            <h2>Login to Alumni Connect</h2>
            <p>Use UserID and password sent to your email</p>
        </div>

        <label>User ID</label>
        <input type="text" id="userId" placeholder="Enter your User ID" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button class="auth-btn" id="loginBtn">Login</button>

        <!-- Forgot Password link added here (alternative placement) -->
        <div style="text-align: center; margin: 10px 0;">
            <a href="forgot-password.html" style="color: #667eea; text-decoration: none; font-size: 14px; transition: color 0.3s;" 
               onmouseover="this.style.color='#764ba2'" onmouseout="this.style.color='#667eea'">
                <i class="fas fa-lock" style="margin-right: 5px; font-size: 12px;"></i>Forgot Password?
            </a>
        </div>

        <p class="auth-switch">
            Don't have credentials?
            <a href="role_select.html">Request here</a>
        </p>
    </div>
</div>

<script src="http://localhost:5000/js/login.js"></script>
</body>
</html>
