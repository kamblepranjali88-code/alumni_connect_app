<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Alumni Network</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>
<body>

<div class="auth-wrapper">

    <!-- Branding -->
    <div class="auth-brand">
        🎓
        <div>
            <h2>Tech University</h2>
            <span>Alumni Network</span>
        </div>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
        <h3>Login</h3>
        <p class="subtitle">Enter your credentials to access your account</p>

        <label>Email ID</label>
        <input type="email" placeholder="your.email@college.edu">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <div class="info-box">
            Initial credentials are provided by the college administration.
            Role is detected automatically.
        </div>

        <button class="btn primary full">Login</button>

        <a href="#" class="link">Forgot password?</a>

        <p class="switch">
            Alumni not invited?
            <a href="alumni-register.html">Register here</a>
        </p>
    </div>

    <a href="index.html" class="back">← Back to home</a>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>
<script src="../js/includeFooter.js"></script>

</body>
</html>
