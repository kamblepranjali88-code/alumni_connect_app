<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Alumni Connect</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-header">
            <i class="fas fa-graduation-cap"></i>
            <h2>Alumni Connect</h2>
            <p>Login to your account</p>
        </div>

        <label>Email ID</label>
        <input type="email" placeholder="your.email@college.edu">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <div class="auth-info">
            Initial credentials are provided by the college.<br>
            Role is detected automatically.
        </div>

        <button class="auth-btn">Login</button>

        <a href="#" class="auth-link">Forgot password?</a>

        <p class="auth-switch">
            Alumni not invited?
            <a href="alumni-register.html">Register here</a>
        </p>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>
</div>

</body>
</html>
