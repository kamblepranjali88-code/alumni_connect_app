<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password | Alumni Connect</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-key"></i>
            <h2>First Time Login</h2>
            <p>Please change your password to continue</p>
        </div>

        <div class="info-box">
            <strong>User ID: <span id="userIdDisplay"></span></strong>
            <p style="font-size: 14px; color: #666; margin-top: 5px;">
                (User ID cannot be changed)
            </p>
        </div>

        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>

        <div class="password-requirements">
            <small>Password must be at least 6 characters</small>
        </div>

        <button class="auth-btn" id="changePwdBtn">Update Password</button>
        
        <p class="auth-switch" style="margin-top: 20px;">
            <a href="login.html">← Back to Login</a>
        </p>
    </div>
</div>

<script src="../js/change-password.js"></script>
</body>
</html>
