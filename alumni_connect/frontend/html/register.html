<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Connect - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🎓</div>
                <span class="logo-text">Alumni Connect</span>
            </div>
            <p class="subtitle">Create your account</p>
        </div>

        <div class="card">
            <h1 class="card-title">Register</h1>
            <p class="card-subtitle">Join our community today</p>

            <form class="form">
                <div class="form-group">
                    <label>I am a</label>
                    <div class="role-selector">
                        <button type="button" class="role-btn active">
                            <span class="role-title">Student</span>
                            <span class="role-desc">Looking for mentorship</span>
                        </button>
                        <button type="button" class="role-btn">
                            <span class="role-title">Alumni</span>
                            <span class="role-desc">Want to mentor</span>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="you@college.edu">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="••••••••">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="grad-year">Expected Graduation Year</label>
                        <input type="text" id="grad-year" placeholder="2026">
                    </div>
                    <div class="form-group">
                        <label for="major">Major/Field</label>
                        <input type="text" id="major" placeholder="Computer Science">
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <p class="footer-text">
                    Already have an account? <a href="login.html">Login here</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
