<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post | Forum | Alumni Connect</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/forum.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="navbar">
    <div class="brand">
        <i class="fas fa-graduation-cap"></i>
        <div>
            <div class="brand-title">Tech University</div>
            <div class="brand-subtitle">Create New Post</div>
        </div>
    </div>
    <nav class="nav-links" id="navbarLinks">
        <!-- Navbar will be set dynamically based on user type -->
    </nav>
</header>

<main class="dashboard">
    <div class="form-container">
        <h2><i class="fas fa-pen-alt"></i> Create New Post</h2>
        
        <form id="createPostForm">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="postTitle" placeholder="What's your question or topic?" required>
            </div>

            <div class="form-group">
                <label>Content</label>
                <textarea id="postContent" rows="8" placeholder="Write your question or share your knowledge..." required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Post
                </button>
                <button type="button" class="btn-cancel" onclick="goBack()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </div>
</main>

<div id="footer-placeholder"></div>
<script src="/js/includeFooter.js"></script>
<script src="/js/forum-create-post.js"></script>

    <script src="logout.js"></script>
</body>
</html>
