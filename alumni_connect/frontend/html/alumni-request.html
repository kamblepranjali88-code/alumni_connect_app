<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alumni Registration | Alumni Connect</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-tie"></i>
            <h2>Alumni Registration</h2>
            <p>College will verify and send credentials to your email</p>
        </div>

        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>PRN Number *</label>
            <input type="text" id="prnNumber" placeholder="e.g. S18CE031" required>
        </div>

        <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label>Email ID *</label>
            <input type="email" id="email" placeholder="your.email@gmail.com" required>
        </div>

        <div class="form-group">
           <label>Graduation Year</label>
<input type="number" id="graduationYear" placeholder="e.g. 2024" min="1950" max="2100" required>

<label>Branch</label>
<select id="branch" required>
    <option value="">Select branch</option>
    <option value="CS">Computer Engineering</option>
    <option value="IT">Information Technology</option>
    <option value="ENTC">Electronics & Telecommunication</option>
</select>
        </div>

        

        <div class="auth-info">
            ⚠️ Make sure your PRN, Date of Birth and Graduation Year match college records.<br>
            You will receive login credentials via email after verification.
        </div>

        <button class="auth-btn" id="submitBtn">Submit Registration</button>

        <p class="auth-switch">
            Already have credentials?
            <a href="login.html">Login here</a>
        </p>

        <a href="role_select.html" class="back-home">← Back to Role Selection</a>
    </div>
</div>

<script src="../js/alumni-request.js"></script>
    <script src="logout.js"></script>
</body>
</html>
