<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mentorship Requests | Alumni Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/mentorship-requests.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
  <div id="navbar-placeholder"></div>

<!-- MAIN -->
<main class="mentorship-container">

    <div class="page-header">
        <h1>Mentorship Requests</h1>
        <p>Review and respond to student mentorship requests</p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-box pending-box">
            <i class="fas fa-clock"></i>
            <div class="stat-num" id="pendingCount">0</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat-box active-box">
            <i class="fas fa-handshake"></i>
            <div class="stat-num" id="activeCount">0</div>
            <div class="stat-label">Active</div>
        </div>
        <div class="stat-box rejected-box">
            <i class="fas fa-times-circle"></i>
            <div class="stat-num" id="rejectedCount">0</div>
            <div class="stat-label">Rejected</div>
        </div>
    </div>

    <!-- Requests List -->
    <div id="requestsList">
        <p class="loading-text"><i class="fas fa-spinner fa-spin"></i> Loading requests...</p>
    </div>

</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>
<script src="../js/includeFooter.js"></script>
<script src="../js/mentorship-requests.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
