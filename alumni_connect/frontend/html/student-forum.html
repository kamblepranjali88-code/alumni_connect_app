<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Forum | Alumni Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/student-forum.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="brand">
            <i class="fas fa-comments"></i>
            <div>
                <div class="brand-title">Tech University</div>
                <div class="brand-subtitle">Student Forum</div>
            </div>
        </div>

        <nav class="nav-links">
             <a href="student-dashboard.html" class="active">Dashboard</a>
        <a href="search-alumni.html">Search Alumni</a>
         <a href="student-profile.html">My Profile</a>
        <a href="student-forum.html">Forum</a>
        <a href="job-opportunities.html">Jobs</a>
        <a href="events.html">Events</a>
        <a href="login.html" class="logout">Logout</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="forum-container">

        <!-- HEADER -->
        <section class="forum-header">
            <div>
                <h1>Discussion Forum</h1>
                <p>Ask questions, reply to peers, and learn together</p>
            </div>

            <button class="btn-primary" id="newTopicBtn">
                <i class="fas fa-plus"></i> Add Question
            </button>
        </section>

        <!-- LAYOUT -->
        <section class="forum-layout">

            <!-- CATEGORIES -->
            <aside class="forum-sidebar">
                <h3>Categories</h3>
                <ul id="categoryList">
                    <li class="active" data-category="All">All</li>
                    <li data-category="Career Advice">Career Advice</li>
                    <li data-category="Learning">Learning</li>
                    <li data-category="Interviews">Interviews</li>
                    <li data-category="Resume">Resume</li>
                    <li data-category="Career Transition">Career Transition</li>
                </ul>
            </aside>

            <!-- CONTENT -->
            <div class="forum-content">

                <div class="forum-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search discussions...">
                </div>

                <div id="discussionList"></div>

            </div>
        </section>
    </main>

    <!-- ADD QUESTION MODAL -->
    <div class="modal-overlay" id="questionModal">
        <div class="modal">
            <h2>Add New Question</h2>

            <form id="addQuestionForm">
                <label>Question Title</label>
                <input type="text" id="questionTitle" placeholder="Enter your question" required>

                <label>Category</label>
                <select id="questionCategory" required>
                    <option value="">Select category</option>
                    <option>Career Advice</option>
                    <option>Learning</option>
                    <option>Interviews</option>
                    <option>Resume</option>
                    <option>Career Transition</option>
                </select>

                <label>Description</label>
                <textarea id="questionDescription" rows="4" placeholder="Explain your question"></textarea>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="closeModal">Cancel</button>
                    <button type="submit" class="btn-primary">Post Question</button>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="../js/includeFooter.js"></script>
    <script src="../js/student-forum.js"></script>

</body>

</html>
