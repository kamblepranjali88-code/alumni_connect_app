<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forum Discussion | Alumni Connect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Common styles -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/forum-thread.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
    <div class="brand">
        <i class="fas fa-comments"></i>
        <div>
            <div class="brand-title">Tech University</div>
            <div class="brand-subtitle">Forum Discussion</div>
        </div>
    </div>

   <nav class="nav-links">
         <a href="student-dashboard.html" class="active">Dashboard</a>
        <a href="search-alumni.html">Search Alumni</a>
        <a href="student-forum.html">Forum</a>
        <a href="job-opportunities.html">Jobs</a>
        <a href="events.html">Events</a>
        <a href="login.html" class="logout">Logout</a>
    </nav>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="thread-container">

    <!-- Question -->
    <section class="question-card">
        <h1 id="questionTitle"></h1>

        <div class="question-meta">
            <span id="questionAuthor"></span>
            <span id="questionTime"></span>
            <span class="category-badge" id="questionCategory"></span>
        </div>

        <p class="question-text" id="questionDescription"></p>
    </section>

    <!-- Replies -->
    <section class="replies-section">
        <h2>Replies</h2>
        <div id="repliesList"></div>
    </section>

    <!-- Add Reply -->
    <section class="add-reply-section">
        <h2>Add Reply</h2>

        <textarea id="replyText"
                  placeholder="Write your reply here..."></textarea>

        <button class="btn-primary" id="postReplyBtn">
            <i class="fas fa-paper-plane"></i> Post Reply
        </button>
    </section>

</main>

<!-- ===== FOOTER ===== -->
<div id="footer-placeholder"></div>
<script src="../js/includeFooter.js"></script>
<script src="../js/forum-thread.js"></script>

</body>
</html>
